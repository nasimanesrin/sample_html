<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>document</title>
</head>
<body>
    <!--Login Form-->
    <form action ="dummy.html">
    <label for="Name">Name:</label>
    <input type="text" id="Name" name="Name" placeholder="eg.john"><br><br>
    <label for="Age">Age:</label>
    <input type="Age" id="Age" name="Age" placeholder="eg.25"><br><br>
    <label for="DOB">DOB:</label>
    <input type="date" id="DOB" name="DOB" required><br><br>
    <label for="gender">gender:</label>
    <input type= "radio" name="gen">male
    <input type="radio" name="gen">female
    <input type="radio" name="gen">other<br><br>
    <label for="email">Email ID:</label>
    <input type="email" id="email" name="email" placeholder="eg.john@example.com"><br><br>
    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone" placeholder="eg.123-456-7890"><br><br>
    <label>choose your Event</label>
    <select>
      <option>Music Concert</option>
      <option>Art Exhibition</option>
        <option>Tech Conference</option>
        <option>Food Festival</option>
        <option>Sports Event</option>
        <option>Workshop</option>
    </select><br><br>
    <label>upload your photo:</label>
    <input type="file" name="photo" accept="image/*"><br><br>
    <label>T&C Delaration:</label>
    <input type="checkbox" name="tnc" required>I agree to the terms and conditions<br><br>
    <input type="submit" value="Register">
    </form>
</body>
</html>
